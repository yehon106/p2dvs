<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PASTE TO DOWNLOAD</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 84 84'%3E%3Crect width='84' height='84' rx='18' fill='%234b3bff'/%3E%3Cpath d='M30 22 H48 a4 4 0 0 1 4 4 V60 a4 4 0 0 1 -4 4 H30 a4 4 0 0 1 -4 -4 V26 a4 4 0 0 1 4 -4 Z' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3Cpath d='M34 22 V19 a3 3 0 0 1 3 -3 h10 a3 3 0 0 1 3 3 V22' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3Cpath d='M31 38 H47 M31 46 H47 M31 54 H41' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root {
    --bg: #f6f5f1;
    --ink: #17171a;
    --muted: #8a887f;
    --accent: #4b3bff;
    --accent-soft: rgba(75, 59, 255, 0.09);
    --line: rgba(23, 23, 26, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113;
      --ink: #f1f0ec; // ---------- UI state ----------
    const typeDropdown = document.getElementById('typeDropdown');
    const customExtInput = document.getElementById('customExtInput');
    typeDropdown.addEventListener('click', (e) => e.stopPropagation());
    customExtInput.addEventListener('click', (e) => e.stopPropagation());

    typeDropdown.addEventListener('change', () => {
      customExtInput.classList.toggle('hidden', typeDropdown.value !== 'custom');
      if (typeDropdown.value === 'custom') customExtInput.focus();
    });

    function selection() {
      const val = typeDropdown.value;
      if (val === 'auto') return { category: 'auto', ext: null };
      if (val === 'custom') {
        const clean = customExtInput.value.trim().replace(/^\.+/, '').toLowerCase().replace(/[^a-z0-9]/g, '');
        return { category: 'custom', ext: clean || 'txt' };
      }
      const [category, ext] = val.split(':');
      return { category, ext };
    }

    // ---------- Status pill ----------
    const statusInner = document.getElementById('statusInner');
    const statusText = document.getElementById('statusText');
    let hideTimer = null;

    function flash(text, ms) {
      statusText.textContent = text;
      statusInner.classList.add('show');
      clearTimeout(hideTimer);
      if (ms) {
        hideTimer = setTimeout(() => statusInner.classList.remove('show'), ms);
      }
    }

    // ---------- Download helpers ----------
    function triggerDownload(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function stamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    }

    function extFromImageMime(mime) {
      const part = (mime.split('/')[1] || 'png').toLowerCase();
      return part === 'jpeg' ? 'jpg' : part;
    }

    function mimeFromExt(ext) {
      if (ext === 'jpg') return 'image/jpeg';
      if (ext === 'webp') return 'image/webp';
      return 'image/png';
    }

    function guessTextExtension(text) {
      const trimmed = text.trim();

      if ((trimmed.startsWith('{') && trimmed.endsWith('}')) ||
          (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
        try { JSON.parse(trimmed); return 'json'; } catch (e) {}
      }
      if (/^<!doctype html/i.test(trimmed) || /^<html[\s>]/i.test(trimmed) ||
          (/<\/?[a-z][\s\S]*>/i.test(trimmed) && trimmed.includes('</'))) {
        return 'html';
      }
      if (/^<\?xml/i.test(trimmed)) return 'xml';

      const lines = trimmed.split('\n').filter(l => l.length > 0);
      if (lines.length >= 2) {
        const counts = lines.slice(0, Math.min(lines.length, 10)).map(l => (l.match(/,/g) || []).length);
        if (counts.every(c => c === counts[0]) && counts[0] >= 1) return 'csv';
      }
      if (/^#{1,6}\s/m.test(trimmed) || /^[-*]\s/m.test(trimmed) || /\*\*[^*]+\*\*/.test(trimmed)) {
        return 'md';
      }
      return 'txt';
    }

    // Convert an image blob to a target format using canvas (only when needed)
    function convertImage(blob, targetExt) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          if (targetExt === 'jpg') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
          ctx.drawImage(img, 0, 0);
          canvas.toBlob((outBlob) => {
            URL.revokeObjectURL(url);
            if (outBlob) resolve(outBlob); else reject(new Error('conversion failed'));
          }, mimeFromExt(targetExt), 0.92);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image load failed')); };
        img.src = url;
      });
    }

    // ---------- Core handlers ----------
    async function handleImage(blob, sourceExt) {
      const sel = selection();
      if (sel.category === 'picture' && sel.ext !== sourceExt) {
        try {
          const converted = await convertImage(blob, sel.ext);
          const name = 'pasted-' + stamp() + '.' + sel.ext;
          triggerDownload(converted, name);
          flash(name, 2600);
          return;
        } catch (e) {
          flash('Could not convert image', 2400);
          return;
        }
      }
      const ext = (sel.category === 'picture' || sel.category === 'custom') ? sel.ext : sourceExt;
      const name = 'pasted-' + stamp() + '.' + ext;
      triggerDownload(blob, name);
      flash(name, 2600);
    }

    function handleText(text) {
      const sel = selection();
      const ext = (sel.category === 'text' || sel.category === 'custom') ? sel.ext : guessTextExtension(text);
      const name = 'pasted-' + stamp() + '.' + ext;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      triggerDownload(blob, name);
      flash(name, 2600);
    }

    function handleGenericFile(blob, name) {
      triggerDownload(blob, name || ('pasted-' + stamp()));
      flash(name || 'file', 2600);
    }

    // ---------- Keyboard paste (Ctrl+V / Cmd+V) ----------
    async function handlePasteEvent(e) {
      const cd = e.clipboardData;
      if (!cd) return;

      if (cd.files && cd.files.length > 0) {
        e.preventDefault();
        const file = cd.files[0];
        handleGenericFile(file, file.name);
        return;
      }

      const items = cd.items;
      if (items) {
        for (const item of items) {
          if (item.kind === 'file' && item.type.indexOf('image') !== -1) {
            e.preventDefault();
            const blob = item.getAsFile();
            await handleImage(blob, extFromImageMime(item.type));
            return;
          }
          if (item.kind === 'file') {
            e.preventDefault();
            const blob = item.getAsFile();
            handleGenericFile(blob, blob.name);
            return;
          }
        }
      }

      const text = cd.getData('text/plain') || cd.getData('text');
      if (text && text.trim().length > 0) {
        e.preventDefault();
        handleText(text);
        return;
      }

      flash('Nothing usable on the clipboard', 2200);
    }
    document.addEventListener('paste', handlePasteEvent);
  </script>
</body>
</html>
